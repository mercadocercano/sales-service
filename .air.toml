root = "."
tmp_dir = "tmp"

[build]
# -buildvcs=false: evita que `go build` intente leer info de VCS del repo
# copiado a la imagen (mismo flag que pim/stock-service por consistencia).
cmd = "go build -buildvcs=false -o ./tmp/main ."
bin = "./tmp/main"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", "tmp", "vendor", ".git"]
exclude_file = []
delay = 1000
stop_on_error = true
log = "air_errors.log"

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
